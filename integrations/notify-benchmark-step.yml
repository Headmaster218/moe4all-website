# Add to the data repository's trusted main workflow after Benchmark validation succeeds.
# WEBSITE_DISPATCH_TOKEN must have permission to dispatch this website repository.
- name: Notify website of merged Benchmark originals
  if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WEBSITE_REPOSITORY != '' }}
  env:
    GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    WEBSITE_REPOSITORY: ${{ vars.WEBSITE_REPOSITORY }}
  shell: bash
  run: |
    test -n "$GH_TOKEN"
    gh api --method POST "repos/$WEBSITE_REPOSITORY/dispatches" -f event_type=benchmark-data
